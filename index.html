<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>全能单词闪卡 | 英式发音·全功能学习平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1A1F2E 0%, #2A2F44 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .app-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: rgba(22, 26, 40, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 1.5rem 1.5rem 2rem;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,215,150,0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }
        .unit-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .unit-selector label {
            font-size: 0.8rem;
            color: #FFD966;
            font-weight: 600;
        }
        #unitSelect {
            background: rgba(255, 180, 70, 0.2);
            border: 1px solid rgba(255,200,100,0.5);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            color: #FFE3B0;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        #unitSelect:focus {
            outline: none;
            border-color: #FFB347;
        }
        #unitSelect option {
            background: #1A1F2E;
            color: #FFE3B0;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(125deg, #FFD966, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .tool-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .icon-btn {
            background: rgba(255, 180, 70, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,200,100,0.5);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #FFE3B0;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn:hover { background: #FFB347; color: #1F1A2E; transform: translateY(-2px); }
        .icon-btn.wrong-btn {
            background: rgba(255, 80, 80, 0.2);
            border-color: rgba(255,120,120,0.5);
            color: #FFB0B0;
        }
        .icon-btn.wrong-btn:hover { background: #FF5050; color: white; }
        .wrong-badge {
            background: #FF3366;
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
        }
        .book-btn {
            background: linear-gradient(145deg, #FFB347, #FF9F2E);
            border: none;
            padding: 0.5rem 1.1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #1F1A2E;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .upload-label {
            background: rgba(44,62,80,0.7);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            color: #FFE1A0;
            cursor: pointer;
            border: 1px solid rgba(255,200,100,0.4);
        }
        #fileInput { display: none; }
        .card-scene {
            perspective: 1600px;
            margin: 1rem 0 1.5rem;
        }
        .flip-card {
            background: transparent;
            width: 100%;
            height: 380px;
            cursor: pointer;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.2,0.9,0.4,1.1);
            transform-style: preserve-3d;
            border-radius: 36px;
        }
        .flip-card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 36px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 35px -8px rgba(0,0,0,0.3);
        }
        .card-front {
            background: radial-gradient(circle at 10% 20%, rgba(255,245,215,1), rgba(255,225,170,1));
            border: 1px solid rgba(255,200,100,0.8);
        }
        .card-back {
            background: linear-gradient(145deg, #e6f0ff, #d9e6ff);
            transform: rotateY(180deg);
            justify-content: center;
            flex-direction: row;
        }
        .back-left {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .back-divider {
            width: 1px;
            height: 70%;
            background: rgba(0,0,0,0.1);
            align-self: center;
        }
        .back-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .word-image-container {
            width: 100%;
            max-height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .word-image-container img {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 8px;
        }
        .word-text {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(125deg, #C84E1A, #E67E22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }
        .pronounce-text {
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(31, 99, 146, 0.15);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            color: #1F6392;
            font-family: monospace;
            margin-top: 0.5rem;
        }
        .phrase-badge {
            background: rgba(0,0,0,0.1);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            color: #A55217;
            margin-top: 1rem;
        }
        .sentence-text {
            font-size: 0.95rem;
            color: #555;
            font-style: italic;
            max-width: 90%;
            margin: 0.8rem auto;
            padding: 0.5rem 1rem;
            background: rgba(31,99,146,0.08);
            border-radius: 8px;
            line-height: 1.5;
        }
        .back-sentence {
            margin: 0.8rem auto;
            max-width: 90%;
        }
        .sentence-original {
            font-size: 1rem;
            color: #333;
            font-style: italic;
            padding: 0.5rem;
            background: rgba(255,255,245,0.9);
            border-radius: 8px;
            border-left: 3px solid #FF9F2E;
        }
        .sentence-translate {
            font-size: 0.95rem;
            color: #1F6392;
            padding: 0.5rem;
            background: rgba(31,99,146,0.08);
            border-radius: 8px;
            margin-top: 0.5rem;
        }
        .back-word {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(125deg, #C84E1A, #E67E22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.2;
        }
        .back-pos {
            font-size: 0.9rem;
            color: #E65100;
            font-weight: 600;
            margin-top: 0.2rem;
        }
        .back-pron {
            font-size: 0.85rem;
            color: #666;
            font-style: italic;
            margin-top: 0.1rem;
        }
        .back-related {
            width: 100%;
        }
        .back-related-title {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .back-related-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 0.85rem;
            color: #555;
            margin: 0.3rem 0;
            padding: 0.3rem 0.5rem;
            background: rgba(255,255,255,0.6);
            border-radius: 8px;
        }
        .back-related-item .rel-word {
            color: #E65100;
            font-weight: 600;
            font-size: 1rem;
        }
        .back-related-item .rel-pos {
            color: #666;
            font-size: 0.75rem;
        }
        .back-related-item .rel-pron {
            color: #999;
            font-style: italic;
            font-size: 0.7rem;
        }
        .back-related-item .rel-meaning {
            color: #333;
            font-size: 0.8rem;
        }
        .back-def {
            font-size: 1.4rem;
            font-weight: 700;
            background: rgba(255,255,245,0.8);
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            max-width: 90%;
            color: #1F2F4A;
        }
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #FFB347, #FF7E33);
            border-radius: 4px;
            margin: 10px 0;
        }
        .favorite-icon {
            position: absolute;
            top: 16px;
            right: 18px;
            z-index: 20;
            font-size: 1.9rem;
            cursor: pointer;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(6px);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: rgba(255,255,200,0.8);
        }
        .favorite-icon.favorited { color: #FF3366; background: rgba(255,245,235,0.9); }
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin: 0.5rem 0 0.8rem;
            flex-wrap: wrap;
        }
        .mode-btn {
            background: #2c3e5c;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 60px;
            color: #FFE3B0;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn:hover { background: #FF9F2E; color: #1F1A2E; transform: scale(0.97);}
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: linear-gradient(110deg, #F2A65A, #F28B3A);
            padding: 0.7rem 1.6rem;
            border-radius: 60px;
            font-weight: 700;
            color: white;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-secondary {
            background: linear-gradient(110deg, #44556b, #2c3e5c);
            padding: 0.7rem 1.6rem;
            border-radius: 60px;
            font-weight: 700;
            color: #FFE3B0;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1.2rem;
            color: #bbb7c6;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: linear-gradient(145deg, #FFF9F0, #FFF2E0);
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            border-radius: 2rem;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #FFB96A;
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
        }
        .close-modal {
            font-size: 1.8rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #D65C1E;
        }
        .word-list {
            overflow-y: auto;
            flex: 1;
        }
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,245,225,0.9);
            margin-bottom: 8px;
            padding: 10px 16px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s;
        }
        .word-item:hover { background: #FFE5C4; transform: scale(0.99);}
        .quiz-options, .phonetic-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 1rem 0;
        }
        .quiz-option, .phonetic-option {
            background: #eef2ff;
            padding: 12px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s;
            font-weight: 500;
            text-align: center;
        }
        .quiz-option:hover, .phonetic-option:hover { background: #FFDAB9; }
        .dictation-input-group {
            margin: 1rem 0;
            text-align: left;
        }
        .dictation-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 2px solid #FFD0A0;
            background: white;
            font-size: 1rem;
            outline: none;
        }
        .sentence-question, .phonetic-question {
            background: #FFF2DF;
            padding: 1.5rem;
            border-radius: 40px;
            margin-bottom: 1.5rem;
            text-align: left;
            font-size: 1rem;
            line-height: 1.5;
        }
        .sentence-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 2px solid #FFD0A0;
            background: white;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .feedback {
            margin: 1rem 0;
            padding: 12px;
            border-radius: 40px;
            font-weight: 500;
        }
        .result-table {
            width: 100%;
            font-size: 0.75rem;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .result-table th, .result-table td {
            border-bottom: 1px solid #FFD0A0;
            padding: 6px 4px;
            text-align: left;
        }
        .toast-message {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1F2A3Ee0;
            backdrop-filter: blur(12px);
            color: #FFE5B4;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            z-index: 1200;
            border-left: 4px solid #FFB347;
        }
        /* 错题本样式 */
        .wrong-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 235, 235, 0.9);
            margin-bottom: 8px;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.1s;
            border-left: 4px solid #FF6666;
        }
        .wrong-item:hover { background: #FFE0E0; transform: scale(0.99); }
        .wrong-item .type-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
            margin-right: 8px;
            white-space: nowrap;
        }
        .type-quiz { background: #cce5ff; color: #004085; }
        .type-dict-word { background: #d4edda; color: #155724; }
        .type-dict-meaning { background: #fff3cd; color: #856404; }
        .type-dict-both { background: #f8d7da; color: #721c24; }
        .type-sentence { background: #e2e3ff; color: #3c3c8a; }
        .type-phonetic { background: #f3e5ff; color: #6b2d8a; }
        .remove-wrong {
            background: none;
            border: none;
            color: #FF6666;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 50%;
            transition: 0.1s;
            flex-shrink: 0;
        }
        .remove-wrong:hover { background: #FF6666; color: white; }
        .empty-msg {
            text-align: center;
            color: #aaa;
            padding: 2rem;
            font-size: 0.9rem;
        }
        .wrong-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .btn-wrong-clear {
            background: linear-gradient(110deg, #ff6b6b, #ee5253);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: white;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .btn-wrong-practice {
            background: linear-gradient(110deg, #ff9f43, #ee5a24);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: white;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        /* 语篇填空样式 */
        .cloze-upload-area {
            border: 2px dashed #FFB347;
            border-radius: 20px;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255,245,225,0.5);
            margin-bottom: 0.8rem;
            position: relative;
        }
        .cloze-upload-area:hover { background: rgba(255,245,225,0.9); border-color: #FF9F2E; }
        .cloze-upload-area.dragover { background: rgba(255,220,180,0.9); border-color: #FF7E33; }
        .cloze-upload-icon { font-size: 2rem; color: #FFB347; margin-bottom: 0.3rem; }
        .cloze-upload-area input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .cloze-textarea {
            width: 100%;
            min-height: 150px;
            border: 2px solid #FFD0A0;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            outline: none;
            background: white;
            margin-bottom: 0.8rem;
        }
        .cloze-textarea:focus { border-color: #FF9F2E; }
        .cloze-image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 16px;
            margin-bottom: 0.8rem;
            border: 2px solid #FFD0A0;
        }
        .cloze-passage-display {
            background: #FFFBF5;
            border-radius: 20px;
            padding: 1.2rem;
            font-size: 0.95rem;
            line-height: 2;
            margin-bottom: 1rem;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #FFE0B0;
        }
        .cloze-blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 2px solid #FF7E33;
            color: #FF7E33;
            font-weight: 700;
            padding: 0 4px;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
        }
        .cloze-blank:hover { background: #FFE0B0; border-radius: 4px; }
        .cloze-blank-input {
            display: inline-block;
            min-width: 80px;
            border: none;
            border-bottom: 2px solid #FF7E33;
            background: transparent;
            font-size: inherit;
            font-family: inherit;
            font-weight: 700;
            color: #FF7E33;
            padding: 0 4px;
            outline: none;
            text-align: center;
        }
        .cloze-blank-input:focus { background: #FFF3E0; }
        .cloze-blank-input.correct { border-color: #28a745; color: #28a745; }
        .cloze-blank-input.wrong { border-color: #dc3545; color: #dc3545; }
        .cloze-blank-input.correct::after { content: ' ✅'; }
        .cloze-blank-input.wrong::after { content: ' ❌'; }
        .cloze-setting-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .cloze-setting-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8B4513;
            white-space: nowrap;
        }
        .cloze-setting-input {
            width: 80px;
            padding: 6px 10px;
            border: 2px solid #FFD0A0;
            border-radius: 60px;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
        }
        .cloze-setting-input:focus { border-color: #FF9F2E; }
        .cloze-hint {
            font-size: 0.78rem;
            color: #999;
            margin-top: 0.3rem;
        }
        .btn-cloze-start {
            background: linear-gradient(110deg, #FF7E33, #FF5722);
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        .btn-cloze-start:hover { opacity: 0.9; transform: scale(0.97); }
        .cloze-image-upload-section { margin-bottom: 1rem; }
        @media (max-width: 550px) {
            .flip-card { height: 340px; }
            .quiz-options, .phonetic-options { grid-template-columns: 1fr; }
        }

    // 错题专项练习
    function practiceWrongAnswers() {
        if (wrongAnswersList.length === 0) {
            showToast('暂无错题');
            return;
        }
        wrongModal.style.display = 'none';
        // 按类型分组练习
        const quizWrong = wrongAnswersList.filter(i => i.type === 'quiz');
        const dictWordWrong = wrongAnswersList.filter(i => i.type === 'dict-word');
        const dictMeaningWrong = wrongAnswersList.filter(i => i.type === 'dict-meaning');
        const dictBothWrong = wrongAnswersList.filter(i => i.type === 'dict-both');
        const sentenceWrong = wrongAnswersList.filter(i => i.type === 'sentence');
        const phoneticWrong = wrongAnswersList.filter(i => i.type === 'phonetic');

        // 随机选一个类型的错题来练习
        const groups = [
            { list: quizWrong, fn: startQuizFromWrong },
            { list: dictWordWrong.length || dictMeaningWrong.length || dictBothWrong.length ? wrongAnswersList.filter(i => ['dict-word','dict-meaning','dict-both'].includes(i.type)) : [], fn: startDictationFromWrong },
            { list: sentenceWrong, fn: startSentenceFromWrong },
            { list: phoneticWrong, fn: startPhoneticFromWrong }
        ].filter(g => g.list.length > 0);

        if (groups.length === 0) {
            showToast('暂无可练习的错题');
            return;
        }

        const chosen = groups[Math.floor(Math.random() * groups.length)];
        chosen.fn(chosen.list);
        showToast(`错题练习开始！共 ${chosen.list.length} 题`);
    }

    // 从错题本启动选择题
    function startQuizFromWrong(wrongItems) {
        const words = [...new Set(wrongItems.map(i => i.word))].map(w => activeVocabulary.find(v => v.text === w)).filter(Boolean);
        if (!words.length) { showToast('未找到相关单词'); return; }

        let qs = words.map(card => {
            let others = activeVocabulary.filter(w => w.text !== card.text).map(w => w.definition);
            others = [...new Set(others)];
            let opts = [card.definition];
            while (opts.length < 4 && others.length) {
                let r = others[Math.floor(Math.random() * others.length)];
                if (!opts.includes(r)) opts.push(r);
            }
            if (opts.length < 4) opts.push("未知", "其他");
            opts = opts.slice(0, 4);
            for (let i = opts.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { word: card.text, correct: card.definition, options: opts };
        });

        for (let i = qs.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [qs[i], qs[j]] = [qs[j], qs[i]];
        }
        quizQuestions = qs;
        currentQuiz = 0;
        quizScore = { correct: 0, total: qs.length };
        renderQuiz(true);
        quizModal.style.display = 'flex';
    }

    // 从错题本启动听写
    function startDictationFromWrong(wrongItems) {
        const words = [...new Set(wrongItems.map(i => i.word))].map(w => activeVocabulary.find(v => v.text === w)).filter(Boolean);
        if (!words.length) { showToast('未找到相关单词'); return; }

        let shuffled = [...words];
        for (let i = shuffled.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        dictationWords = shuffled;
        currentDict = 0;
        dictStats = { correctWords: 0, correctMeanings: 0, total: dictationWords.length };
        dictDetails = [];
        renderDictation(true);
        dictationModal.style.display = 'flex';
    }

    // 从错题本启动完成句子
    function startSentenceFromWrong(wrongItems) {
        const targets = [...new Set(wrongItems.map(i => i.word))];
        let filtered = SENTENCE_BANK.filter(q => targets.some(t => normalize(q.answer) === normalize(t)));
        if (!filtered.length) filtered = SENTENCE_BANK.filter(q => targets.some(t => normalize(q.answer).includes(normalize(t))));
        if (!filtered.length) {
            showToast('未在题库中找到对应句子');
            return;
        }
        let shuffled = [...filtered];
        for (let i = shuffled.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        sentenceList = shuffled;
        currentSent = 0;
        sentStats = { correct: 0, total: sentenceList.length };
        sentDetails = [];
        renderSentence(true);
        sentenceModal.style.display = 'flex';
    }

    // 从错题本启动辨音题
    function startPhoneticFromWrong(wrongItems) {
        const targets = [...new Set(wrongItems.map(i => i.word))];
        let filtered = PHONETIC_BANK.filter(q => targets.some(t => q.options.includes(t)));
        if (!filtered.length) {
            showToast('未在题库中找到对应辨音题');
            return;

    function speak() {

        const doSpeak = (voices) => {
            const u = new SpeechSynthesisUtterance(w);

            if (enVoice) u.voice = enVoice;

        // 先尝试直接获取语音

        const translateBtn = document.getElementById('translateBtn');
        const text = sentenceOriginal.textContent;
        
        if (!text) return;

                sentenceTranslate.style.display = 'block';

            return;
        }
        
        // 调用翻译API
        translateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 翻译中...';
        translateBtn.disabled = true;
        
        const encodedText = encodeURIComponent(text);
        const apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodedText}`;
        
        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {

                    const translation = data[0].map(item => item[0]).join('');
                    sentenceTranslate.textContent = translation;

                showToast("翻译失败，请重试");
                translateBtn.innerHTML = '<i class="fas fa-language"></i> 翻译';
            })
            .finally(() => {
                translateBtn.disabled = false;
            });
    }
    
    // ==================== 图片上传 ====================
    function handleImageWordUpload(files) {
        if (files.length === 0) return;
        showToast(`正在识别 ${files.length} 张图片...`);
        const statusEl = document.getElementById('uploadStatus');
        
        // 使用Tesseract进行OCR
        if (typeof Tesseract === 'undefined') {
            showToast("OCR组件加载中，请稍后重试");
            return;
        }
        
        let processed = 0, success = 0;
        
        for (let file of files) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgData = e.target.result;
                statusEl.textContent = `正在识别: ${file.name}`;
                
                Tesseract.recognize(imgData, 'eng', {
                    logger: m => console.log(m)
                }).then(result => {
                    const text = result.data.text;
                    // 提取单词（每行一个）
                    const lines = text.split(/[\n\r]+/).filter(l => l.trim());
                    
                    for (let line of lines) {
                        let parsed = parseVocabularyLine(line);
                        if (parsed) {
                            const exist = activeVocabulary.find(v => v.text.toLowerCase() === parsed.text.toLowerCase());
                            if (!exist) {
                                activeVocabulary.push(parsed);
                                success++;
                            }
                        }
                    }
                    
                    processed++;
                    if (processed === files.length) {
                        saveCustom();
                        updateCard();
                        statusEl.textContent = '';
                        showToast(`识别完成！提取了 ${success} 个单词`);
                    }
                }).catch(err => {
                    console.error('OCR error:', err);
                    processed++;
                    if (processed === files.length) {
                        saveCustom();
                        updateCard();
                        statusEl.textContent = '';
                        showToast(`识别完成！提取了 ${success} 个单词`);
                    }
                });
            };
            reader.readAsDataURL(file);
        }
    }

            for (let i = opts.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
            return { word: card.text, correct: card.definition, options: opts };
        });
