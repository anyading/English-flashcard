            dictDetails.forEach(d => { details += `<tr><td>${escapeHtml(d.word)}</td><td>${escapeHtml(d.userWord || '—')}</td><td>${d.wordCorrect ? '✅' : '❌'}</td><td>${escapeHtml(d.userMeaning || '—')}</td><td>${d.meaningCorrect ? '✅' : '❌'} ${escapeHtml(d.correctMeaning)}</td></tr>`; });
            details += '</tbody></table>';
            container.innerHTML = `<div class="feedback" style="background:#e0ffe0;">✅ 单词正确: ${dictStats.correctWords}/${dictStats.total} (${percentW}%)<br>📖 中文正确: ${dictStats.correctMeanings}/${dictStats.total} (${percentM}%)</div><button id="showDictDetails">查看详情</button><div id="dictDetailPanel" style="display:none;">${details}</div><button class="btn-primary" id="restartDict">再练一次</button><button class="btn-secondary" id="closeDict">关闭</button>`;
            document.getElementById('showDictDetails')?.addEventListener('click', () => { let p = document.getElementById('dictDetailPanel'); if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none'; });
            document.getElementById('restartDict')?.addEventListener('click', () => startDictation(isFromWrong));
            document.getElementById('closeDict')?.addEventListener('click', () => dictationModal.style.display = 'none');
            return;
        }
        const w = dictationWords[currentDict];
        const pronDisplay = w.pronunciation ? w.pronunciation : "📘 短语";
        container.innerHTML = `<div class="sentence-question">🔊 音标：${escapeHtml(pronDisplay)}</div><div class="dictation-input-group"><label>📝 英文单词：</label><input id="dictWord" class="dictation-input" placeholder="输入单词..."></div><div class="dictation-input-group"><label>📖 中文释义：</label><input id="dictMeaning" class="dictation-input" placeholder="输入中文..."></div><div class="feedback" id="dictFB"></div><div>进度: ${currentDict + 1}/${dictationWords.length}</div><button class="btn-primary" id="submitDict">提交</button>`;
        const submit = document.getElementById('submitDict');
        submit.onclick = () => {
            const userWord = document.getElementById('dictWord').value.trim().toLowerCase();
            const userMean = document.getElementById('dictMeaning').value.trim();
            const wordCorrect = (userWord === w.text.toLowerCase());
            const meaningCorrect = isMeaningSimilar(userMean, w.definition);

            if (wordCorrect) dictStats.correctWords++;
            if (meaningCorrect) dictStats.correctMeanings++;

            dictDetails.push({ word: w.text, userWord: userWord, wordCorrect: wordCorrect, correctMeaning: w.definition, userMeaning: userMean, meaningCorrect: meaningCorrect });

            let msg = '', fb = document.getElementById('dictFB');
            const bothCorrect = wordCorrect && meaningCorrect;
            const bothWrong = !wordCorrect && !meaningCorrect;

            if (bothCorrect) {
                msg = '🎉 完美！';
                fb.style.backgroundColor = '#d4ffd4';
                removeFromWrongAnswers('dict-word', w.text, w.text);
                removeFromWrongAnswers('dict-meaning', w.text, w.definition);
                removeFromWrongAnswers('dict-both', w.text, `${w.text} → ${w.definition}`);
            } else if (bothWrong) {
                msg = `❌ 都错了。正确：${w.text} → ${w.definition}`;
                fb.style.backgroundColor = '#fff0d0';
                addToWrongAnswers({ type: 'dict-both', word: w.text, wrongAnswer: `${userWord || '—'} / ${userMean || '—'}`, correctAnswer: `${w.text} → ${w.definition}`, question: `音标: ${pronDisplay}` });
            } else if (!wordCorrect) {
                msg = `⚠️ 单词错误，中文正确。正确单词：${w.text}`;
                fb.style.backgroundColor = '#fff8dc';
                addToWrongAnswers({ type: 'dict-word', word: w.text, wrongAnswer: userWord || '—', correctAnswer: w.text, question: `音标: ${pronDisplay} → 中文: ${w.definition}` });
                removeFromWrongAnswers('dict-meaning', w.text, w.definition);
            } else {
                msg = `⚠️ 中文错误，单词正确。正确中文：${w.definition}`;
                fb.style.backgroundColor = '#fff8dc';
                addToWrongAnswers({ type: 'dict-meaning', word: w.text, wrongAnswer: userMean || '—', correctAnswer: w.definition, question: `单词: ${w.text}，音标: ${pronDisplay}` });
                removeFromWrongAnswers('dict-word', w.text, w.text);
            }

            fb.innerHTML = msg;
            currentDict++;
            setTimeout(() => renderDictation(isFromWrong), 1200);
        };
    }

    // ==================== 完成句子 ====================
    function startSentences(isFromWrong = false) {
        const unitSentences = UNIT_SENTENCES[currentUnit];
        if (!unitSentences || unitSentences.length === 0) {
            showToast('当前单元暂无句子题');
            return;
        }
        let shuffled = [...unitSentences];
        for (let i = shuffled.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
        sentenceList = shuffled;
        currentSent = 0;
        sentStats = { correct: 0, total: sentenceList.length };
        sentDetails = [];
        renderSentence(isFromWrong);
        sentenceModal.style.display = 'flex';
    }

    function renderSentence(isFromWrong = false) {
        const container = document.getElementById('sentenceContainer');
        if (currentSent >= sentenceList.length) {
            let percent = Math.round((sentStats.correct / sentStats.total) * 100);
            let details = '<table class="result-table"><thead><tr><th>句子</th><th>你的答案</th><th>正确答案</th><th>结果</th></tr></thead><tbody>';
            sentDetails.forEach(d => { details += `<tr><td>${escapeHtml(d.sentencePreview)}</td><td>${escapeHtml(d.userAnswer || '—')}</td><td>${escapeHtml(d.correctAnswer)}</td><td>${d.isCorrect ? '✅' : '❌'}</td></tr>`; });
            details += '</tbody></table>';
            container.innerHTML = `<div class="feedback" style="background:#e0ffe0;">✅ 正确: ${sentStats.correct}/${sentStats.total} (${percent}%)</div><button id="showSentDetails">查看详情</button><div id="sentDetailPanel" style="display:none;">${details}</div><button class="btn-primary" id="restartSent">再练一次</button><button class="btn-primary" id="random10Sent">🎲 随机10题</button><button class="btn-secondary" id="closeSent">关闭</button>`;
            document.getElementById('showSentDetails')?.addEventListener('click', () => { let p = document.getElementById('sentDetailPanel'); if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none'; });
            document.getElementById('restartSent')?.addEventListener('click', () => startSentences(isFromWrong));
            document.getElementById('random10Sent')?.addEventListener('click', () => {
                const unitSentences = UNIT_SENTENCES[currentUnit];
                if (!unitSentences || unitSentences.length === 0) {
                    showToast('当前单元暂无句子题');
                    return;
                }
                let all = [...unitSentences];
                for (let i = all.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
                sentenceList = all.slice(0, Math.min(10, all.length));
                currentSent = 0; sentStats = { correct: 0, total: sentenceList.length }; sentDetails = [];
                renderSentence();
            });
            document.getElementById('closeSent')?.addEventListener('click', () => sentenceModal.style.display = 'none');
            return;
        }
        const q = sentenceList[currentSent];
        container.innerHTML = `<div class="sentence-question">${escapeHtml(q.sentence)}<br><input id="sentInput" class="sentence-input" placeholder="填写正确的短语或单词..."></div><div class="feedback" id="sentFB"></div><div>进度: ${currentSent + 1}/${sentenceList.length}</div><button class="btn-primary" id="submitSent">提交</button>`;
        const submit = document.getElementById('submitSent');
        submit.onclick = () => {
            const user = document.getElementById('sentInput').value.trim();
            const correctRaw = q.answer;
            const isCorrect = (normalize(user) === normalize(correctRaw));
            if (isCorrect) sentStats.correct++;
            sentDetails.push({ sentencePreview: q.sentence.substring(0, 40), userAnswer: user, correctAnswer: correctRaw, isCorrect: isCorrect });
            const fb = document.getElementById('sentFB');
            if (isCorrect) {
                fb.innerHTML = '✅ 正确！';
                fb.style.backgroundColor = '#d4ffd4';
                removeFromWrongAnswers('sentence', correctRaw, correctRaw);
            } else {
                fb.innerHTML = `❌ 错误。正确答案：${escapeHtml(correctRaw)}`;
                fb.style.backgroundColor = '#fff0d0';
                addToWrongAnswers({ type: 'sentence', word: correctRaw, wrongAnswer: user || '—', correctAnswer: correctRaw, question: q.sentence });
            }
            currentSent++;
            setTimeout(() => renderSentence(isFromWrong), 1200);
        };
    }

    // ==================== 辨音题 ====================
    function startPhonetic(isFromWrong = false) {
        const unitPhonetics = UNIT_PHONETICS[currentUnit];
        if (!unitPhonetics || unitPhonetics.length === 0) {
            showToast('当前单元暂无辨音题');
            return;
        }
        let shuffled = [...unitPhonetics];
        for (let i = shuffled.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
        phoneticList = shuffled;
        currentPho = 0;
        phoStats = { correct: 0, total: phoneticList.length };
        phoDetails = [];
        renderPhonetic(isFromWrong);
        phoneticModal.style.display = 'flex';
    }

    function renderPhonetic(isFromWrong = false) {
        const container = document.getElementById('phoneticContainer');
        if (currentPho >= phoneticList.length) {
            let percent = Math.round((phoStats.correct / phoStats.total) * 100);
            let details = '<table class="result-table"><thead><tr><th>题目</th><th>你的选择</th><th>正确答案</th><th>结果</th></tr></thead><tbody>';
            phoDetails.forEach(d => { details += `<tr><td>${escapeHtml(d.questionPreview)}</td><td>${escapeHtml(d.userChoice)}</td><td>${escapeHtml(d.correctAnswer)}</td><td>${d.isCorrect ? '✅' : '❌'}</td></tr>`; });
            details += '</tbody></table>';
            container.innerHTML = `<div class="feedback" style="background:#e0ffe0;">✅ 正确: ${phoStats.correct}/${phoStats.total} (${percent}%)</div><button id="showPhoDetails">查看详情</button><div id="phoDetailPanel" style="display:none;">${details}</div><button class="btn-primary" id="restartPho">再练一次</button><button class="btn-secondary" id="closePho">关闭</button>`;
            document.getElementById('showPhoDetails')?.addEventListener('click', () => { let p = document.getElementById('phoDetailPanel'); if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none'; });
            document.getElementById('restartPho')?.addEventListener('click', () => startPhonetic(isFromWrong));
            document.getElementById('closePho')?.addEventListener('click', () => phoneticModal.style.display = 'none');
            return;
        }
        const q = phoneticList[currentPho];
        const letters = ['A', 'B', 'C', 'D'];
        let optsHtml = '';
        q.options.forEach((opt, idx) => { optsHtml += `<div class="phonetic-option" data-idx="${idx}">${letters[idx]}. ${addUnderline(opt, q.underline)}</div>`; });
        container.innerHTML = `<div class="phonetic-question">🔊 选出划线部分发音不同的单词</div><div class="phonetic-options">${optsHtml}</div><div class="feedback" id="phoFB"></div><div>进度: ${currentPho + 1}/${phoneticList.length}</div>`;
        document.querySelectorAll('.phonetic-option').forEach(opt => {
            opt.addEventListener('click', () => {
                const selIdx = parseInt(opt.dataset.idx);
                const isCorrect = (selIdx === q.correct);
                const selWord = q.options[selIdx];
                if (isCorrect) phoStats.correct++;
                phoDetails.push({ questionPreview: q.options.map((w, i) => `${letters[i]}.${w}`).join(' '), userChoice: letters[selIdx], correctAnswer: letters[q.correct], isCorrect: isCorrect });
                const fb = document.getElementById('phoFB');
                if (isCorrect) {
                    fb.innerHTML = '✅ 正确！';
                    fb.style.backgroundColor = '#d4ffd4';
                    removeFromWrongAnswers('phonetic', selWord, q.options[q.correct]);
                } else {
                    fb.innerHTML = `❌ 错误。正确答案是 ${letters[q.correct]}. ${q.options[q.correct]}`;
                    fb.style.backgroundColor = '#fff0d0';
                    addToWrongAnswers({ type: 'phonetic', word: selWord, wrongAnswer: `${letters[selIdx]}.${selWord}`, correctAnswer: `${letters[q.correct]}.${q.options[q.correct]}`, question: `选出划线[${q.underline}]发音不同的: ${q.options.join(', ')}` });
                }
                currentPho++;
                setTimeout(() => renderPhonetic(isFromWrong), 1200);
            });
        });
    }

    // ==================== 语篇填空 ====================
    // clozeState: { rawText, blanks: [{word, start, end}], answers: [{user, correct}], imageData, currentStep: 'input'|'practice' }
    let clozeState = { rawText: '', blanks: [], answers: [], imageData: '', currentStep: 'input' };

    // 保存和加载语篇文本
    function saveClozeText() {
        const text = document.getElementById('clozeTextInput')?.value.trim();
        if (text) {
            localStorage.setItem('cloze_saved_text', text);
            showToast('文本已保存，下次可直接使用');
        }
    }

    // 多文本保存管理
    function getSavedPassages() {
        const s = localStorage.getItem('cloze_saved_passages');
        return s ? JSON.parse(s) : [];
    }

    function savePassage(name, text) {
        const passages = getSavedPassages();
        const id = Date.now();
        passages.unshift({ id, name, text, savedAt: new Date().toLocaleString() });
        localStorage.setItem('cloze_saved_passages', JSON.stringify(passages));
        return passages;
    }

    function deletePassage(id) {
        const passages = getSavedPassages().filter(p => p.id !== id);
        localStorage.setItem('cloze_saved_passages', JSON.stringify(passages));
        return passages;
    }

    function openClozeModal() {
        clozeState = { rawText: '', blanks: [], answers: [], imageData: '', currentStep: 'input' };
        renderClozeInput();
        clozeModal.style.display = 'flex';
    }

    function renderClozeInput() {
        const container = document.getElementById('clozeContainer');
        const passages = getSavedPassages();
        let passagesListHtml = '';
        if (passages.length > 0) {
            passagesListHtml = `
                <div style="margin-bottom:1rem;">
                    <div class="cloze-setting-label" style="margin-bottom:0.5rem;"><i class="fas fa-list"></i> 已保存的课文</div>
                    <div style="max-height:150px;overflow-y:auto;border:1px solid rgba(255,215,150,0.2);border-radius:8px;padding:0.5rem;">
                        ${passages.map(p => `
                            <div style="display:flex;align-items:center;justify-content:space-between;padding:0.4rem 0.5rem;border-radius:6px;margin-bottom:0.3rem;background:rgba(255,255,255,0.05);" class="passage-item">
                                <div style="flex:1;min-width:0;">
                                    <div style="font-size:0.85rem;color:#FFD966;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>
                                    <div style="font-size:0.7rem;color:#888;">${p.savedAt}</div>
                                </div>
                                <div style="display:flex;gap:0.3rem;flex-shrink:0;">
                                    <button class="btn-secondary cloze-use-btn" data-id="${p.id}" data-text="${escapeHtml(p.text).replace(/"/g, '&quot;')}" style="padding:0.25rem 0.5rem;font-size:0.7rem;"><i class="fas fa-play"></i> 使用</button>
                                    <button class="btn-secondary cloze-del-btn" data-id="${p.id}" style="padding:0.25rem 0.5rem;font-size:0.7rem;color:#ff6b6b;"><i class="fas fa-trash-alt"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        let imgPreview = '';
        if (clozeState.imageData) {
            imgPreview = `<img src="${clozeState.imageData}" class="cloze-image-preview" id="clozeImgPreview" alt="课文图片">`;
        }
        container.innerHTML = `
            ${passagesListHtml}
            <div class="cloze-image-upload-section">
                <div class="cloze-setting-label" style="margin-bottom:0.5rem;"><i class="fas fa-image"></i> 上传课文图片（可选）</div>
                <div class="cloze-upload-area" id="clozeUploadArea">
                    <div class="cloze-upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <div style="font-size:0.85rem;color:#A55217;">点击上传图片 / 拖拽图片到此处</div>
                </div>
                <input type="file" id="clozeImgInput" accept="image/*" style="display:none;">
                ${imgPreview}
            </div>
            <div class="cloze-setting-label" style="margin-bottom:0.5rem;"><i class="fas fa-align-left"></i> 粘贴课文文本</div>
            <textarea id="clozeTextInput" class="cloze-textarea" placeholder="在此粘贴英文课文内容...">${escapeHtml(clozeState.rawText)}</textarea>
            <div class="cloze-setting-row">
                <span class="cloze-setting-label"><i class="fas fa-magic"></i> 挖空数量：</span>
                <input type="number" id="clozeCountInput" class="cloze-setting-input" value="10" min="3" max="30">
            </div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                <button class="btn-cloze-start" id="clozeGenerateBtn"><i class="fas fa-wand-magic-sparkles"></i> 生成填空题</button>
                <button class="btn-secondary" id="clozeSaveTextBtn" style="padding:0.5rem 1rem;font-size:0.8rem;"><i class="fas fa-save"></i> 保存</button>
                <button class="btn-secondary" id="clozeExportBtn" style="padding:0.5rem 1rem;font-size:0.8rem;"><i class="fas fa-file-export"></i> 导出</button>
                <button class="btn-secondary" id="clozeImportBtn" style="padding:0.5rem 1rem;font-size:0.8rem;"><i class="fas fa-file-import"></i> 导入</button>
                <input type="file" id="clozeFileImport" accept=".txt,.text" style="display:none;">
                ${clozeState.imageData ? '<button class="btn-secondary" id="clozeClearImgBtn" style="padding:0.5rem 1rem;font-size:0.8rem;"><i class="fas fa-trash-alt"></i> 清除图片</button>' : ''}
            </div>
        `;

        // 点击上传
        const uploadArea = document.getElementById('clozeUploadArea');
        const imgInput = document.getElementById('clozeImgInput');
        uploadArea?.addEventListener('click', () => imgInput?.click());
        imgInput?.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                loadClozeImage(e.target.files[0]);
            }
        });

        // 拖拽上传
        uploadArea?.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea?.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea?.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) loadClozeImage(file);
        });

        // 清除图片按钮
        document.getElementById('clozeClearImgBtn')?.addEventListener('click', () => {
            clozeState.imageData = '';
            renderClozeInput();
        });

        // 导入文件输入框变化事件
        document.getElementById('clozeFileImport')?.addEventListener('change', (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const content = evt.target?.result;
                if (typeof content === 'string') {
                    clozeState.rawText = content;
                    const textInput = document.getElementById('clozeTextInput');
                    if (textInput) textInput.value = content;
                    showToast('已导入：' + file.name);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // 使用事件委托处理动态元素
        container.onclick = (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            
            // 使用已保存的课文
            if (btn.classList.contains('cloze-use-btn')) {
                const text = btn.dataset.text;
                clozeState.rawText = text;
                const textInput = document.getElementById('clozeTextInput');
                if (textInput) textInput.value = text;
                showToast('已加载课文');
                return;
            }
            
            // 删除已保存的课文
            if (btn.classList.contains('cloze-del-btn')) {
                const id = parseInt(btn.dataset.id);
                deletePassage(id);
                renderClozeInput();
                showToast('已删除');
                return;
            }
            
            // 保存文本按钮 - 弹出命名对话框
            if (btn.id === 'clozeSaveTextBtn') {
                const text = document.getElementById('clozeTextInput')?.value.trim();
                if (!text) {
                    showToast('请先输入或粘贴文本');
                    return;
                }
                const name = prompt('请输入课文名称（如：Unit 1 Reading）：', `课文 ${getSavedPassages().length + 1}`);
                if (name && name.trim()) {
                    savePassage(name.trim(), text);
                    renderClozeInput();
                    showToast('已保存：' + name.trim());
                }
                return;
            }
            
            // 导出文件按钮
            if (btn.id === 'clozeExportBtn') {
                const text = document.getElementById('clozeTextInput')?.value.trim();
                if (!text) {
                    showToast('请先输入或加载文本');
                    return;
                }
                const name = prompt('请输入文件名（不含扩展名）：', `课文_${new Date().toLocaleDateString().replace(/\//g, '-')}`);
                if (!name || !name.trim()) return;
                const fileName = name.trim().replace(/[<>:"/\\|?*]/g, '_') + '.txt';
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('已导出文件：' + fileName);
                return;
            }
            
            // 导入文件按钮
            if (btn.id === 'clozeImportBtn') {
                document.getElementById('clozeFileImport')?.click();
                return;
            }
            
            // 生成按钮
            if (btn.id === 'clozeGenerateBtn') {
                const text = document.getElementById('clozeTextInput').value.trim();
                const count = parseInt(document.getElementById('clozeCountInput').value) || 10;
                if (!text && !clozeState.imageData) {
                    showToast('请上传课文图片或输入课文文本');
                    return;
                }
                clozeState.rawText = text;
                generateClozeBlanks(text, count);
            }
        };
    }

    function loadClozeImage(file) {
        console.log('loadClozeImage called, file:', file);
        
        const reader = new FileReader();
        reader.onload = async (e) => {
            console.log('FileReader onload fired');
            clozeState.imageData = e.target.result;
            console.log('Image data set, length:', e.target.result?.length);
            renderClozeInput();
            
            // 检查 Tesseract 是否可用
            if (typeof Tesseract === 'undefined') {
                showToast('OCR 组件加载中，图片已显示，可稍后再试');
                return;
            }
            
            // 显示 OCR 加载状态
            const container = document.getElementById('clozeContainer');
            const loadingHtml = `
                <div id="clozeOcrLoading" style="background:#fff3cd;border-radius:8px;padding:1rem;margin-bottom:1rem;text-align:center;">
                    <div style="color:#856404;font-size:0.9rem;">
                        <i class="fas fa-spinner fa-spin" style="margin-right:0.5rem;"></i>
                        正在识别图片文字，请稍候...
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('afterbegin', loadingHtml);
            
            try {
                // 使用 Tesseract.js 进行 OCR
                const result = await Tesseract.recognize(
                    clozeState.imageData,
                    'eng',
                    {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                const percent = Math.round(m.progress * 100);
                                const loadingEl = document.getElementById('clozeOcrLoading');
                                if (loadingEl) {
                                    loadingEl.innerHTML = `
                                        <div style="color:#856404;font-size:0.9rem;">
                                            <i class="fas fa-spinner fa-spin" style="margin-right:0.5rem;"></i>
                                            正在识别图片文字... ${percent}%
                                        </div>
                                        <div style="background:#e0e0e0;border-radius:4px;height:6px;margin-top:0.5rem;">
                                            <div style="background:#FFB347;height:100%;border-radius:4px;width:${percent}%;transition:width 0.3s;"></div>
                                        </div>
                                    `;
                                }
                            }
                        }
                    }
                );
                
                const recognizedText = result.data.text.trim();
                
                // 移除加载状态
                const loadingEl = document.getElementById('clozeOcrLoading');
                if (loadingEl) loadingEl.remove();
                
                if (recognizedText && recognizedText.length > 10) {
                    clozeState.rawText = recognizedText;
                    // 显示识别结果，让用户确认/编辑后再生成
                    renderClozeInput();
                    // 自动聚焦到文本框让用户编辑
                    setTimeout(() => {
                        const textInput = document.getElementById('clozeTextInput');
                        if (textInput) textInput.focus();
                    }, 100);
                    showToast('图片文字已识别，请在文本框中编辑后点击"生成填空题"');
                } else {
                    showToast('图片中未识别到足够文字，请手动输入');
                }
            } catch (err) {
                console.error('OCR Error:', err);
                const loadingEl = document.getElementById('clozeOcrLoading');
                if (loadingEl) loadingEl.remove();
                showToast('文字识别失败，图片已显示可直接使用');
            }
        };
        
        reader.onerror = (err) => {
            console.error('FileReader error:', err);
            showToast('图片加载失败，请尝试其他图片');
        };
        
        reader.readAsDataURL(file);
    }

    // 智能挖词：提取考点词汇
    function extractCandidateWords(text) {
        const candidates = [];

        // 1. 提取短语（动词短语、介词短语、常见搭配）
        const phrasePatterns = [
            /\b(\w+ \w+ \w+)\b/g,  // 三词短语
            /\b(\w+ \w+)\b/g       // 两词短语
        ];
        const phraseSet = new Set();
        const phraseMatches = [];

        // 常见短语搭配词
        const phraseStarters = new Set(['take','make','get','put','turn','pick','give','look','go','come','run','cut','turn','bring','fall','carry','set','keep','hold','take','break','turn','look','call','try','ask','think','seem','help','show','hear','play','run','move','live','believe','stand','lose','pay','meet','include','continue','set','learn','change','lead','understand','watch','follow','stop','create','speak','read','spend','grow','open','walk','win','offer','remember','love','consider','appear','buy','wait','serve','die','send','expect','build','stay','fall','cut','reach','kill','remain','suggest','raise','pass','sell','require','report','decide','pull']);

        // 提取两词短语
        const twoWordRegex = /\b([a-zA-Z]+)\s+([a-zA-Z]+)\b/g;
        let match;
        while ((match = twoWordRegex.exec(text)) !== null) {
            const w1 = match[1].toLowerCase();
            const w2 = match[2].toLowerCase();
            // 跳过纯虚词组合
            const stopCombos = ['the a','a the','in a','in the','to a','to the','of a','of the','and a','and the','for a','is a','is the','it is','this is','that is','you are','i am','he is','she is','we are','they are','it was','there is','there are'];
            if (stopCombos.includes(w1 + ' ' + w2)) continue;
            // 短语优先：包含常见动词开头或常见搭配
            if (phraseStarters.has(w1) || ['up','out','in','on','off','away','back','down','about','into','over','through','with','for','at','to','from','by'].includes(w2)) {
                const phrase = match[0];
                if (!phraseSet.has(phrase.toLowerCase())) {
                    phraseSet.add(phrase.toLowerCase());
                    phraseMatches.push({ word: phrase, isPhrase: true, priority: 3 });
                }
            }
        }

        // 2. 提取有意义的单词（给不同类型打分）
        const tokens = text.split(/[\s\n\r.,!?;:'"()[\]{}]+/);

        // 重点词汇特征
        const importantSuffixes = ['tion','sion','ment','ness','ity','ance','ence','able','ible','al','ful','less','ous','ive','er','or','ist','ism'];
        const verbSuffixes = ['ize','ise','ify','ate','en'];
        const adjSuffixes = ['able','ible','al','ful','less','ous','ive','ent','ant','ary','ory'];
        const nounSuffixes = ['tion','sion','ment','ness','ity','ance','ence','er','or','ist','ism','dom','hood','ship'];

        for (const token of tokens) {
            const clean = token.trim().replace(/^[^a-zA-Z]+|[^a-zA-Z]+$/g, '');
            if (!clean || clean.length < 2 || clean.length > 20) continue;
            if (/^\d+$/.test(clean)) continue;
            if (/[0-9]/.test(clean)) continue;

            const lower = clean.toLowerCase();

            // 介词和连词 - 低优先级但保留
            const preps = ['in','on','at','to','for','of','with','by','from','as','into','over','through','about','against','among','between','during','before','after','without','within','along','across','behind','beyond','under','until','since','toward','towards','upon','within','off','out'];
            const conjunctions = ['and','or','but','so','yet','because','although','while','when','if','unless','since','until','whether','neither','either','both','nor'];

            if (preps.includes(lower) || conjunctions.includes(lower)) {
                candidates.push({ word: clean, isPhrase: false, priority: 1 });
                continue;
            }

            // 跳过常见虚词
            const stopWords = ['the','a','an','this','that','these','those','it','its','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','must','shall','can','not','no','all','any','each','every','both','few','more','most','other','some','such','very','just','only','even','also','then','there','here','up','out','now','still','already','always','never','ever','again','once','much','many','such'];
            if (stopWords.includes(lower)) continue;

            // 计算单词重要性分数
            let priority = 2; // 默认优先级

            // 后缀加分
            if (importantSuffixes.some(s => lower.endsWith(s))) priority = 3;
            if (nounSuffixes.some(s => lower.endsWith(s))) priority = 3;
            if (adjSuffixes.some(s => lower.endsWith(s))) priority = 2.5;
            if (verbSuffixes.some(s => lower.endsWith(s))) priority = 2.5;

            // 大写开头的词（可能是专有名词或重要词）加分
            if (/^[A-Z]/.test(clean) && clean.length > 3) priority = 3;

            // 常见考试词汇加分
            const examWords = ['important','different','similar','complete','prepare','increase','provide','describe','develop','explain','express','include','believe','consider','continue','decide','describe','determine','discover','establish','experience','improve','indicate','influence','introduce','involve','maintain','measure','observe','occur','organize','perform','prevent','produce','protect','recognize','reduce','reflect','relate','remain','represent','require','respond','result','reveal','separate','situation','social','society','special','specific','standard','structure','support','survive','technique','temperature','theory','traditional','transfer','transform','transport','treatment','typical','understand','unit','universe','universal','value','variety','various','western','whether','whole','wide','wild','willing','wise','wonder','world','worth','wrong','young','zero'];
            if (examWords.includes(lower)) priority = 3;

            candidates.push({ word: clean, isPhrase: false, priority });
        }

        // 合并短语和单词，短语优先
        return [...phraseMatches, ...candidates];
    }

    // 生成挖空
    function generateClozeBlanks(text, count) {
        const candidates = extractCandidateWords(text);
        if (candidates.length === 0) {
            showToast('文本中未找到合适的单词，请输入更多英文内容');
            return;
        }

        // 找到每个候选词在原文中的实际位置
        const wordPositions = [];
        for (const item of candidates) {
            const word = item.word;
            const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`\\b${escapedWord}\\b`, 'i');
            const match = text.match(regex);
            if (match && match.index !== undefined) {
                wordPositions.push({
                    word: match[0],
                    lower: word.toLowerCase(),
                    start: match.index,
                    end: match.index + match[0].length,
                    priority: item.priority,
                    isPhrase: item.isPhrase
                });
            }
        }

        // 去重（同词只留一个）
        const seen = new Set();
        const unique = wordPositions.filter(b => {
            if (seen.has(b.lower)) return false;
            seen.add(b.lower);
            return true;
        });

        if (unique.length === 0) {
            showToast('无法挖空，请检查文本内容');
            return;
        }

        // 加权随机选择：高优先级词被选中的概率更高
        const selected = [];
        const available = [...unique];
        const targetCount = Math.min(count, available.length);
        
        while (selected.length < targetCount && available.length > 0) {
            // 计算总权重
            const totalWeight = available.reduce((sum, item) => sum + item.priority, 0);
            // 随机点
            let random = Math.random() * totalWeight;
            // 根据权重选择
            for (let i = 0; i < available.length; i++) {
                random -= available[i].priority;
                if (random <= 0) {
                    selected.push(available[i]);
                    available.splice(i, 1);
                    break;
                }
            }
            // 防止死循环（万一浮点运算问题）
            if (selected.length === 0 && available.length > 0) {
                selected.push(available.shift());
            }
        }

        clozeState.blanks = selected;
        clozeState.answers = selected.map(() => ({ user: '', correct: false }));
        clozeState.currentStep = 'practice';
        renderClozePractice();
    }

    function renderClozePractice() {
        const container = document.getElementById('clozeContainer');
        const { rawText, blanks, answers, imageData } = clozeState;

        // 构建带空格的原文展示（按位置排序）
        blanks.sort((a, b) => a.start - b.start);

        let htmlParts = [];
        let lastEnd = 0;

        for (let i = 0; i < blanks.length; i++) {
            const b = blanks[i];
            // 添加挖空前的内容
            if (b.start > lastEnd) {
                htmlParts.push(escapeHtml(rawText.substring(lastEnd, b.start)));
            }
            // 添加空格（用特殊标记）
            htmlParts.push(`%%BLANK_${i}%%`);
            lastEnd = b.end;
        }
        if (lastEnd < rawText.length) {
            htmlParts.push(escapeHtml(rawText.substring(lastEnd)));
        }

        let passageHtml = htmlParts.join('').replace(
            /%%BLANK_(\d)%%/g,
            (match, idx) => {
                const i = parseInt(idx);
                const ans = answers[i];
                if (ans.user !== '') {
                    const cls = ans.correct ? 'correct' : 'wrong';
                    return `<span class="cloze-blank-input ${cls}" title="${escapeHtml(ans.correct ? '正确' : '错误')}">${escapeHtml(ans.user)}</span>`;
                }
                return `<input class="cloze-blank-input" data-blank-idx="${i}" placeholder="___" style="text-align:center;">`;
            }
        );

        let imgHtml = '';
        if (imageData) {
            imgHtml = `<img src="${imageData}" class="cloze-image-preview" style="margin-bottom:1rem;" alt="课文图片">`;
        }

        const correctCount = answers.filter(a => a.correct).length;
        const total = blanks.length;

        container.innerHTML = `
            ${imgHtml}
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;flex-wrap:wrap;gap:0.5rem;">
                <span style="font-size:0.8rem;color:#A55217;font-weight:600;"><i class="fas fa-check-circle"></i> 已答对 ${correctCount} / ${total} 空</span>
                <div style="display:flex;gap:0.4rem;">
                    <button class="btn-secondary" id="clozeReeditBtn" style="padding:0.4rem 0.8rem;font-size:0.75rem;"><i class="fas fa-edit"></i> 重新编辑</button>
                    <button class="btn-secondary" id="clozeRerandomBtn" style="padding:0.4rem 0.8rem;font-size:0.75rem;"><i class="fas fa-shuffle"></i> 再次随机</button>
                    <button class="btn-secondary" id="clozeShowAnsBtn" style="padding:0.4rem 0.8rem;font-size:0.75rem;"><i class="fas fa-eye"></i> 显示答案</button>
                </div>
            </div>
            <div class="cloze-passage-display" id="clozePassageDisplay">${passageHtml}</div>
            <div class="feedback" id="clozeFB" style="display:none;"></div>
            <div style="display:flex;gap:0.5rem;margin-top:0.8rem;flex-wrap:wrap;">
                <button class="btn-cloze-start" id="clozeSubmitBtn"><i class="fas fa-paper-plane"></i> 提交本空</button>
                <button class="btn-primary" id="clozeCheckAllBtn"><i class="fas fa-clipboard-check"></i> 全部检查</button>
            </div>
        `;

        // 重新编辑
        document.getElementById('clozeReeditBtn').addEventListener('click', () => {
            clozeState.rawText = document.getElementById('clozeTextInput')?.value || rawText;
            clozeState.currentStep = 'input';
            renderClozeInput();
        });

        // 再次随机出题
        document.getElementById('clozeRerandomBtn').addEventListener('click', () => {
            const text = clozeState.rawText || rawText;
            const count = blanks.length || 10;
            generateClozeBlanks(text, count);
            showToast('已重新随机出题');
        });

        // 显示答案
        document.getElementById('clozeShowAnsBtn').addEventListener('click', () => {
            const passage = document.getElementById('clozePassageDisplay');
            blanks.sort((a, b) => a.start - b.start);
            let html = passage.innerHTML;
            blanks.forEach((b, i) => {
                const input = passage.querySelector(`[data-blank-idx="${i}"]`);
                if (input) {
                    input.value = b.word;
                    input.className = 'cloze-blank-input correct';
                    answers[i] = { user: b.word, correct: true };
                }
            });
            showToast('已显示所有答案');
        });

        // 输入框事件：回车跳到下一空
        const inputs = passage.querySelectorAll('.cloze-blank-input');
        inputs.forEach((inp, idx) => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    // 标记已填
                    const blankIdx = parseInt(inp.dataset.blankIdx);
                    answers[blankIdx] = { user: inp.value.trim(), correct: false };
                    // 自动跳到下一空
                    const nextInput = passage.querySelector(`[data-blank-idx="${blankIdx + 1}"]`);
                    if (nextInput) nextInput.focus();
                    else document.getElementById('clozeSubmitBtn')?.click();
                }
            });
        });

        // 提交本空
        document.getElementById('clozeSubmitBtn').addEventListener('click', () => {
            const inputs = document.querySelectorAll('.cloze-blank-input');
            let foundEmpty = false;
            let firstEmptyIdx = -1;

            for (const inp of inputs) {
                const blankIdx = parseInt(inp.dataset.blankIdx);
                if (isNaN(blankIdx)) continue;
                const val = inp.value.trim();
                if (val === '') {
                    if (firstEmptyIdx === -1) firstEmptyIdx = blankIdx;
                    foundEmpty = true;
                    continue;
                }
                const correct = normalize(val) === normalize(blanks[blankIdx].word);
                answers[blankIdx] = { user: val, correct };
                inp.className = `cloze-blank-input ${correct ? 'correct' : 'wrong'}`;

                if (!correct) {
                    addToWrongAnswers({
                        type: 'cloze',
                        word: blanks[blankIdx].word,
                        wrongAnswer: val,
                        correctAnswer: blanks[blankIdx].word,
                        question: `语篇填空: "${rawText.substring(Math.max(0, blanks[blankIdx].start - 20), blanks[blankIdx].start)}[${'?'}]${rawText.substring(blanks[blankIdx].end, Math.min(rawText.length, blanks[blankIdx].end + 20))}"`
                    });
                }
            }

            if (foundEmpty && firstEmptyIdx !== -1) {
                const emptyInput = document.querySelector(`[data-blank-idx="${firstEmptyIdx}"]`);
                emptyInput?.focus();
                showToast('请填写所有空格');
                return;
            }

            const fb = document.getElementById('clozeFB');
            const correctCount = answers.filter(a => a.correct).length;
            const total = blanks.length;
            fb.style.display = 'block';
            fb.innerHTML = `✅ 本轮已答对 ${correctCount} / ${total} 空`;
            fb.style.backgroundColor = correctCount === total ? '#d4ffd4' : '#fff0d0';
        });

        // 全部检查
        document.getElementById('clozeCheckAllBtn').addEventListener('click', () => {
            const inputs = document.querySelectorAll('.cloze-blank-input');
            let allFilled = true;
            let correctCount = 0;
            let wrongCount = 0;

            inputs.forEach(inp => {
                const blankIdx = parseInt(inp.dataset.blankIdx);
                if (isNaN(blankIdx)) return;
                const val = inp.value.trim();
                if (val === '') {
                    allFilled = false;
                    inp.className = 'cloze-blank-input wrong';
                    inp.placeholder = '未填写!';
                    return;
                }
                const correct = normalize(val) === normalize(blanks[blankIdx].word);
                answers[blankIdx] = { user: val, correct };
                inp.className = `cloze-blank-input ${correct ? 'correct' : 'wrong'}`;
                if (correct) correctCount++;
                else wrongCount++;
            });

            const fb = document.getElementById('clozeFB');
            fb.style.display = 'block';
            const total = blanks.length;
            const percent = Math.round((correctCount / total) * 100);

            if (!allFilled) {
                fb.innerHTML = '⚠️ 请先填写所有空格！';
                fb.style.backgroundColor = '#fff3cd';
                return;
            }

            if (wrongCount === 0) {
                fb.innerHTML = `🎉 太棒了！全部正确！${correctCount}/${total} (${percent}%)`;
                fb.style.backgroundColor = '#d4ffd4';
            } else {
                fb.innerHTML = `📊 正确: ${correctCount}/${total} (${percent}%) &nbsp; 错误: ${wrongCount} 空`;
                fb.style.backgroundColor = '#fff0d0';
            }
        });
    }

    // ==================== 导入 ====================
    function parseCSVContent(content) {
        const lines = content.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 1) return [];
        
        const firstLine = lines[0].toLowerCase();
        const hasHeader = firstLine.includes('text') || firstLine.includes('word') || firstLine.includes('单词');
        
        let startIndex = 0;
        let textIdx = 0, defIdx = 1, pronIdx = -1, imgIdx = -1;
        
        if (hasHeader) {
            const headers = lines[0].split(',').map(s => s.trim().toLowerCase());
            textIdx = headers.indexOf('text');
            if (textIdx === -1) textIdx = headers.indexOf('word');
            if (textIdx === -1) textIdx = headers.indexOf('单词');
            defIdx = headers.indexOf('definition');
            if (defIdx === -1) defIdx = headers.indexOf('meaning');
            if (defIdx === -1) defIdx = headers.indexOf('中文');
            if (defIdx === -1) defIdx = headers.indexOf('释义');
            pronIdx = headers.indexOf('pronunciation');
            if (pronIdx === -1) pronIdx = headers.indexOf('音标');
            if (pronIdx === -1) pronIdx = headers.indexOf('发音');
            imgIdx = headers.indexOf('image');
            if (imgIdx === -1) imgIdx = headers.indexOf('img');
            if (imgIdx === -1) imgIdx = headers.indexOf('图片');
            startIndex = 1;
        }
        
        const imported = [];
        for (let i = startIndex; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            let parts;
            if (line.includes('\t')) {
                parts = line.split('\t');
            } else if (line.includes(';')) {
                parts = line.split(';');
            } else {
                parts = line.split(',');
            }
            
            let text = parts[textIdx]?.trim();
            let def = parts[defIdx]?.trim();
            
            if (!text || text === 'undefined') text = parts[0]?.trim();
            if (!def || def === 'undefined') def = parts[1]?.trim();
            
            if (text && def) {
                const pron = pronIdx >= 0 ? parts[pronIdx]?.trim() || "" : "";
                const img = imgIdx >= 0 ? parts[imgIdx]?.trim() || "" : "";
                imported.push({ text, definition: def, pronunciation: pron, image: img });
            }
        }
        return imported;
    }
    
    function parseJSONContent(content) {
        const parsed = JSON.parse(content);
        if (Array.isArray(parsed)) {
            return parsed.filter(i => i.text && i.definition);
        } else if (parsed.words && Array.isArray(parsed.words)) {
            return parsed.words.filter(i => i.text && i.definition);
        } else if (parsed.data && Array.isArray(parsed.data)) {
            return parsed.data.filter(i => i.text && i.definition);
        }
        return [];
    }
    
    // 处理JPG图片文件，转换为base64并按文件名匹配
    function processImageFiles(imageFiles, wordMap) {
        const promises = [];
        for (let imgFile of imageFiles) {
            const wordName = imgFile.name.replace(/\.(jpg|jpeg|png|gif)$/i, '').toLowerCase();
            if (wordMap[wordName] !== undefined) {
                promises.push(
                    new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            wordMap[wordName].image = e.target.result;
                            resolve(true);
                        };
                        reader.onerror = () => resolve(false);
                        reader.readAsDataURL(imgFile);
                    })
                );
            }
        }
        return Promise.all(promises);
    }
    
    function importFile(file, imageFiles) {
        const ext = file.name.split('.').pop().toLowerCase();
        
        // 处理ZIP文件
        if (ext === 'zip') {
            if (typeof JSZip === 'undefined') {
                showToast("ZIP组件加载中，请稍后重试");
                return;
            }
            
            JSZip.loadAsync(file).then(function(zip) {
                let dataFile = null;
                let dataContent = null;
                const imageMap = {};
                
                // 查找数据文件和图片
                zip.forEach(function(path, zipEntry) {
                    const name = path.toLowerCase();
                    if (!zipEntry.dir) {
                        if (name === 'data.json' || name === 'data.txt' || name === 'words.json') {
                            dataFile = zipEntry;
                        } else if (name === 'data.csv' || name === 'words.csv') {
                            dataFile = zipEntry;
                        } else if (name.startsWith('images/') || name.startsWith('img/') || name.startsWith('pictures/')) {
                            // 收集图片
                            const imgName = path.split('/').pop().split('\\').pop().toLowerCase();
                            imageMap[imgName] = path;
                        }
                    }
                });
                
                if (!dataFile) {
                    showToast("ZIP中未找到数据文件(data.json/data.csv)");
                    return;
                }
                
                return dataFile.async('string').then(function(content) {
                    let imported = [];
                    const dataName = dataFile.name.toLowerCase();
                    
                    if (dataName.endsWith('.json')) {
                        imported = parseJSONContent(content);
                    } else {
                        imported = parseCSVContent(content);
                    }
                    
                    if (imported.length === 0) {
                        showToast("数据文件中未找到有效单词");
                        return;
                    }
                    
                    // 处理图片映射
                    let imgLoaded = 0, imgTotal = 0;
                    const imgPromises = [];
                    
                    for (let w of imported) {
                        if (w.image) {
                            const imgName = w.image.toLowerCase().replace(/^.*[\\/]/, '');
                            const zipPath = imageMap[imgName];
                            if (zipPath) {
                                imgTotal++;
                                imgPromises.push(
                                    zip.file(zipPath).async('base64').then(function(base64) {
                                        const ext = imgName.split('.').pop().toLowerCase();
                                        const mime = ext === 'png' ? 'image/png' : ext === 'gif' ? 'image/gif' : 'image/jpeg';
                                        w.image = 'data:' + mime + ';base64,' + base64;
                                        imgLoaded++;
                                    })
                                );
                            }
                        }
                    }
                    
                    return Promise.all(imgPromises).then(function() {
                        return { imported, imgLoaded };
                    });
                });
            }).then(function(result) {
                if (!result) return;
                
                const { imported, imgLoaded } = result;
                let newCount = 0, updateCount = 0;
                
                for (let nw of imported) {
                    const exist = activeVocabulary.find(w => w.text.toLowerCase() === nw.text.toLowerCase());
                    if (exist) {
                        exist.definition = nw.definition;
                        if (nw.pronunciation) exist.pronunciation = nw.pronunciation;
                        if (nw.image) exist.image = nw.image;
                        updateCount++;
                    } else {
                        activeVocabulary.push({ text: nw.text, pronunciation: nw.pronunciation || "", definition: nw.definition, image: nw.image || "" });
                        newCount++;
                    }
                }
                
                saveCustom();
                if (currentCardIndex >= activeVocabulary.length) currentCardIndex = 0;
                updateCard();
                showToast(`导入成功！新增${newCount}个，更新${updateCount}个${imgLoaded > 0 ? '，图片' + imgLoaded + '张' : ''}`);
            }).catch(function(err) {
                console.error('ZIP import error:', err);
                showToast("ZIP导入失败：" + err.message);
            });
            return;
        }
        
        // 处理普通文件
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                let imported = [];
                const content = e.target.result;
                
                if (ext === 'json') {
                    imported = parseJSONContent(content);
                } else if (ext === 'csv' || ext === 'txt') {
                    imported = parseCSVContent(content);
                } else {
                    showToast("仅支持 JSON/CSV/TXT/ZIP 格式");
                    return;
                }
                
                if (imported.length === 0) {
                    showToast("未找到有效单词数据");
                    return;
                }
                
                // 构建单词映射，用于匹配图片
                const wordMap = {};
                for (let w of imported) {
                    wordMap[w.text.toLowerCase()] = w;
                }
                
                // 处理外部上传的图片
                let imgMatched = 0;
                if (imageFiles && imageFiles.length > 0) {
                    const imgPromises = [];
                    for (let imgFile of imageFiles) {
                        const wordName = imgFile.name.replace(/\.(jpg|jpeg|png|gif)$/i, '').toLowerCase();
                        if (wordMap[wordName]) {
                            imgPromises.push(
                                new Promise((resolve) => {
                                    const imgReader = new FileReader();
                                    imgReader.onload = (e) => {
                                        wordMap[wordName].image = e.target.result;
                                        imgMatched++;
                                        resolve(true);
                                    };
                                    imgReader.onerror = () => resolve(false);
                                    imgReader.readAsDataURL(imgFile);
                                })
                            );
                        }
                    }
                    // 等待所有图片处理完成
                    if (imgPromises.length > 0) {
                        Promise.all(imgPromises).then(() => doImport(imported, imgMatched));
                        return;
                    }
                }
                
                doImport(imported, imgMatched);
                
                function doImport(imported, imgMatched) {
                    let newCount = 0, updateCount = 0;
                    for (let nw of imported) {
                        const exist = activeVocabulary.find(w => w.text.toLowerCase() === nw.text.toLowerCase());
                        if (exist) {
                            exist.definition = nw.definition;
                            if (nw.pronunciation) exist.pronunciation = nw.pronunciation;
                            if (nw.image) exist.image = nw.image;
                            updateCount++;
                        } else {
                            activeVocabulary.push({ text: nw.text, pronunciation: nw.pronunciation || "", definition: nw.definition, image: nw.image || "" });
                            newCount++;
                        }
                    }
                    saveCustom();
                    if (currentCardIndex >= activeVocabulary.length) currentCardIndex = 0;
                    updateCard();
                    let msg = `导入成功！新增${newCount}个，更新${updateCount}个`;
                    if (imgMatched > 0) msg += `，匹配图片${imgMatched}张`;
                    showToast(msg);
                }
            } catch (err) {
                console.error('Import error:', err);
                showToast("导入失败：" + err.message);
            }
        };
        reader.readAsText(file, "UTF-8");
    }

    // ==================== 事件绑定 ====================
    function bindEvents() {
        prevBtn.onclick = () => { if (activeVocabulary.length) { currentCardIndex = (currentCardIndex - 1 + activeVocabulary.length) % activeVocabulary.length; updateCard(); } };
        nextBtn.onclick = () => { if (activeVocabulary.length) { currentCardIndex = (currentCardIndex + 1) % activeVocabulary.length; updateCard(); } };
        randomBtn.onclick = () => { if (activeVocabulary.length) { let newIdx = Math.floor(Math.random() * activeVocabulary.length); if (newIdx === currentCardIndex && activeVocabulary.length > 1) newIdx = (newIdx + 1) % activeVocabulary.length; currentCardIndex = newIdx; updateCard(); } };
        flipCard.onclick = (e) => { if (!e.target.closest('.favorite-icon')) { flipCard.classList.toggle('flipped'); isFlipped = flipCard.classList.contains('flipped'); } };
        favBtn.onclick = toggleFav;
        speakBtn.onclick = speak;
        quizBtn.onclick = () => startQuiz(false);
        dictationBtn.onclick = () => startDictation(false);
        sentenceBtn.onclick = () => startSentences(false);
        phoneticBtn.onclick = () => startPhonetic(false);
        clozeBtn.onclick = openClozeModal;
        allWordsBtn.onclick = () => { renderAllWords(); allWordsModal.style.display = 'flex'; };
        viewNotebookBtn.onclick = () => { renderNotebook(); notebookModal.style.display = 'flex'; };
        viewWrongBtn.onclick = () => { renderWrongNotebook(); wrongModal.style.display = 'flex'; };
        
        // 翻译按钮
        document.getElementById('translateBtn').onclick = translateSentence;
        
        // 图片上传
        document.getElementById('imgWordInput').onchange = (e) => {
            if (e.target.files.length > 0) {
                handleImageWordUpload(Array.from(e.target.files));
                e.target.value = '';
            }
        };
        document.getElementById('dataFileInput').onchange = (e) => {
            if (e.target.files[0]) {
                showAddWordModal();
                document.getElementById('batchFileInput').files = e.target.files;
                document.getElementById('batchFileName').textContent = e.target.files[0].name;
                e.target.value = '';
            }
        };
        
        closeAllModal.onclick = () => allWordsModal.style.display = 'none';
        closeNotebookModal.onclick = () => notebookModal.style.display = 'none';
        closeWrongModal.onclick = () => wrongModal.style.display = 'none';
        closeQuizModal.onclick = () => quizModal.style.display = 'none';
        closeDictationModal.onclick = () => dictationModal.style.display = 'none';
        closeSentenceModal.onclick = () => sentenceModal.style.display = 'none';
        closePhoneticModal.onclick = () => phoneticModal.style.display = 'none';
        closeClozeModal.onclick = () => clozeModal.style.display = 'none';
        
        // 导入单词模态框
        const addWordModal = document.getElementById('addWordModal');
        const closeAddWordModal = document.getElementById('closeAddWordModal');
        const batchFileInput = document.getElementById('batchFileInput');
        const batchImgInput = document.getElementById('batchImgInput');
        const batchFileName = document.getElementById('batchFileName');
        const batchImgCount = document.getElementById('batchImgCount');
        const doBatchImport = document.getElementById('doBatchImport');
        let selectedBatchFile = null;
        let selectedBatchImages = [];
        
        closeAddWordModal.onclick = () => addWordModal.style.display = 'none';
        window.showAddWordModal = function() { addWordModal.style.display = 'flex'; };
        
        batchFileInput.onchange = (e) => {
            if (e.target.files[0]) {
                selectedBatchFile = e.target.files[0];
                batchFileName.textContent = selectedBatchFile.name;
            }
        };
        
        batchImgInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                selectedBatchImages = Array.from(e.target.files);
                batchImgCount.textContent = `已选择 ${selectedBatchImages.length} 张图片`;
            }
        };
        
        doBatchImport.onclick = () => {
            if (!selectedBatchFile) {
                showToast("请先选择数据文件（JSON/CSV）");
                return;
            }
            importFile(selectedBatchFile, selectedBatchImages);
            addWordModal.style.display = 'none';
            selectedBatchFile = null;
            selectedBatchImages = [];
            batchFileName.textContent = '';
            batchImgCount.textContent = '';
        };
        
        window.onclick = (e) => {
            if (e.target === allWordsModal) allWordsModal.style.display = 'none';
            if (e.target === notebookModal) notebookModal.style.display = 'none';
            if (e.target === wrongModal) wrongModal.style.display = 'none';
            if (e.target === quizModal) quizModal.style.display = 'none';
            if (e.target === dictationModal) dictationModal.style.display = 'none';
            if (e.target === sentenceModal) sentenceModal.style.display = 'none';
            if (e.target === phoneticModal) phoneticModal.style.display = 'none';
            if (e.target === clozeModal) clozeModal.style.display = 'none';
            if (e.target === addWordModal) addWordModal.style.display = 'none';
        };
    }

    function init() {
        // 恢复上次选择的单元
        const savedUnit = localStorage.getItem('current_unit');
        if (savedUnit && UNIT_WORDS[savedUnit]) {
            currentUnit = savedUnit;
            document.getElementById('unitSelect').value = savedUnit;
        }
        
        loadFav();
        loadWrongAnswers();
        mergeVocab();
        if (activeVocabulary.length === 0) activeVocabulary = [...UNIT_WORDS[currentUnit]];
        currentCardIndex = 0; isFlipped = false;
        updateCard();
        bindEvents();
        
        // 单元切换事件
        document.getElementById('unitSelect').addEventListener('change', (e) => {
            switchUnit(e.target.value);
        });
    }
    init();
</script>
